name: Caliper test
version: "2.0.0"

caliper:
  blockchain: fabric

channels:
  # channelName of mychannel matches the name of the channel created by test network
  - channelName: mychannel
    # the chaincodeIDs of all the fabric chaincodes in caliper-benchmarks
    contracts:
    - id: scidatahub

organizations:
  - mspid: Org1MSP
    # Identities come from cryptogen created material for test-network
    identities:
      certificates:
      - name: 'Admin@org1.example.com'
        clientPrivateKey:
          path: '../blockchain/test-network/organizations/peerOrganizations/org1.example.com/users/Admin@org1.example.com/msp/keystore/412c185f72ad4518684dad17fbcc90eec6448dd7b3501380e4e902a44104b313_sk'
        clientSignedCert:
          path: '../blockchain/test-network/organizations/peerOrganizations/org1.example.com/users/Admin@org1.example.com/msp/signcerts/cert.pem'
    connectionProfile:
      path: '../blockchain/test-network/organizations/peerOrganizations/org1.example.com/connection-org1.yaml'
      discover: true

